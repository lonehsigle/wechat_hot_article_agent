services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      - DATABASE_URL=postgresql://content_monitor:${PG_PASSWORD:?PG_PASSWORD is required}@postgres:5432/content_monitor_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  content-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://content_monitor:${PG_PASSWORD:?PG_PASSWORD is required}@postgres:5432/content_monitor_db
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:?DB_ENCRYPTION_KEY is required}
      - PASSWORD_HASH_SALT=${PASSWORD_HASH_SALT:?PASSWORD_HASH_SALT is required}
      - AUTH_COOKIE_SECRET=${AUTH_COOKIE_SECRET:?AUTH_COOKIE_SECRET is required}
      - INTERNAL_WORKER_TOKEN=${INTERNAL_WORKER_TOKEN:-}
      - WECHAT_APPID=${WECHAT_APPID:-}
      - WECHAT_SECRET=${WECHAT_SECRET:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 生产环境资源限制
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=content_monitor
      - POSTGRES_PASSWORD=${PG_PASSWORD:?PG_PASSWORD is required}
      - POSTGRES_DB=content_monitor_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content_monitor -d content_monitor_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
